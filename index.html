<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programul de muncă (2026 & 2027)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        button, select, input {
            font-family: inherit;
        }
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .header-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .brand-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            text-decoration: underline;
            text-decoration-color: #818cf8;
        }
        .brand-sub {
            font-size: 12px;
            color: #64748b;
            margin: 2px 0 0;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .btn {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover {
            background: #f1f5f9;
        }
        .btn-primary {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-dark {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
        select, input[type="text"] {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 13px;
        }
        .week-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }
        .week-tab {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .week-tab.active {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
        }
        .main {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
        }
        .stat-label {
            font-size: 12px;
            color: #64748b;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 800;
            margin-top: 4px;
        }
        .toolbar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }
        .note-banner {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #78350f;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .table-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            overflow: auto;
            max-height: 75vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 780px;
        }
        th {
            background: #0f172a;
            color: #ffffff;
            padding: 10px 8px;
            font-size: 13px;
            border: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 8px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            vertical-align: middle;
        }
        .sticky-col {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 15;
            font-weight: 700;
        }
        th.sticky-col {
            background: #0f172a;
            z-index: 20;
        }
        .shift-cell {
            text-align: center;
            cursor: pointer;
            padding: 8px 6px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid transparent;
        }
        .s-06 { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
        .s-07 { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
        .s-08 { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
        .s-10 { background: #fef3c7; color: #b45309; border-color: #fde68a; }
        .s-vrij { background: #ffe4e6; color: #be123c; border-color: #fecdd3; }
        .s-vac { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
        .s-empty { background: #f8fafc; color: #94a3b8; }
        .extra-tag {
            display: inline-block;
            margin-top: 3px;
            padding: 1px 5px;
            border-radius: 5px;
            font-size: 10px;
            background: #f59e0b;
            color: #0f172a;
            font-weight: 800;
        }
        .dept-row td {
            background: #f1f5f9;
            font-weight: 800;
            color: #1e293b;
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }
        .modal-backdrop.open {
            display: flex;
        }
        .modal-card {
            background: #ffffff;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            padding: 18px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }
        .modal-card.rot-ccw {
            transform: rotate(-90deg);
            max-width: 78vh;
        }
        .modal-card.rot-cw {
            transform: rotate(90deg);
            max-width: 78vh;
        }
        .fs-active .table-box {
            position: fixed;
            inset: 0;
            z-index: 40;
            max-height: 100vh;
            border-radius: 0;
            background: #ffffff;
        }
        .fs-active.rot-ccw .table-box {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            max-width: none;
            max-height: none;
            transform: translate(-50%, -50%) rotate(-90deg);
        }
        .fs-active.rot-cw .table-box {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            max-width: none;
            max-height: none;
            transform: translate(-50%, -50%) rotate(90deg);
        }
        .fs-bar {
            display: none;
            background: #0f172a;
            color: #ffffff;
            padding: 8px 12px;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .fs-active .fs-bar {
            display: flex;
        }
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .field input, .field select {
            width: 100%;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }
    </style>
</head>
<body id="app-body">
    <header class="header">
        <div class="header-top">
            <div class="brand" onclick="toggleFullscreen()">
                <div>
                    <h1 class="brand-title">Programul de muncă</h1>
                    <p class="brand-sub">Click pe titlu pentru tot ecranul & rotire • Date 2026 & 2027</p>
                </div>
            </div>

            <div class="controls-row">
                <select id="year-select" onchange="onYearChange()">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                </select>
                <select id="week-select" onchange="switchWeek(this.value)"></select>
                <button type="button" class="btn btn-primary" onclick="toggleFullscreen()">Tot ecranul / Rotește</button>
                <button type="button" class="btn btn-dark" onclick="openAddModal()">+ Persoană</button>
                <button type="button" class="btn" onclick="exportCSV()">Export CSV</button>
                <button type="button" class="btn" onclick="resetAllData()">Reset</button>
            </div>
        </div>
        <div id="week-tabs" class="week-tabs"></div>
    </header>

    <main class="main">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Persoane</div>
                <div id="stat-people" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Ture Active</div>
                <div id="stat-shifts" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Zile Libere (Vrij)</div>
                <div id="stat-vrij" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Note / Extra / Concediu</div>
                <div id="stat-special" class="stat-value">0</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="filters">
                <input type="text" id="search-input" placeholder="Caută persoană..." oninput="renderTable()">
                <select id="dept-filter" onchange="renderTable()"></select>
                <select id="day-filter" onchange="renderTable()"></select>
                <select id="status-filter" onchange="renderTable()">
                    <option value="ALL">Toate statusurile</option>
                    <option value="WORKING">Doar cei care lucrează</option>
                    <option value="VRIJ">Doar Vrij</option>
                    <option value="SPECIAL">Note speciale</option>
                </select>
            </div>
        </div>

        <div id="note-banner" class="note-banner" style="display:none;"></div>

        <div class="table-box">
            <div class="fs-bar">
                <strong>Programul de muncă</strong>
                <div style="display:flex; gap:6px;">
                    <button type="button" class="btn" onclick="rotateFullscreen()">↻ Rotește</button>
                    <button type="button" class="btn btn-dark" onclick="openAddModal()">+ Persoană</button>
                    <button type="button" class="btn btn-danger" onclick="exitFullscreen()">✕ Ieși</button>
                </div>
            </div>
            <table>
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
                <tfoot id="tfoot"></tfoot>
            </table>
        </div>
    </main>

    <!-- Modal Editare Tură -->
    <div id="edit-modal" class="modal-backdrop">
        <div id="edit-modal-card" class="modal-card">
            <h3 id="edit-title" style="margin:0 0 4px;">Editare Tură</h3>
            <p id="edit-sub" style="margin:0 0 12px; font-size:12px; color:#64748b;"></p>
            <div class="preset-grid">
                <button type="button" class="btn" onclick="setPreset('06:00','')">06:00</button>
                <button type="button" class="btn" onclick="setPreset('07:00','')">07:00</button>
                <button type="button" class="btn" onclick="setPreset('08:00','')">08:00</button>
                <button type="button" class="btn" onclick="setPreset('10:00','')">10:00</button>
                <button type="button" class="btn" onclick="setPreset('Vrij','')">Vrij</button>
                <button type="button" class="btn" onclick="setPreset('Vakantie','')">Vakantie</button>
                <button type="button" class="btn" onclick="setPreset('07:00','Extra')">+ Extra</button>
                <button type="button" class="btn" onclick="setPreset('','')">Gol (-)</button>
            </div>
            <form onsubmit="saveEdit(event)">
                <div class="field">
                    <label>Oră început / Status</label>
                    <input type="text" id="edit-begin">
                </div>
                <div class="field">
                    <label>Notă / Oră sfârșit (ex. Extra, TAS)</label>
                    <input type="text" id="edit-end">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeEditModal()">Anulează</button>
                    <button type="submit" class="btn btn-primary">Salvează</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Adăugare Persoană -->
    <div id="add-modal" class="modal-backdrop">
        <div id="add-modal-card" class="modal-card">
            <h3 style="margin:0 0 12px;">Adaugă Persoană</h3>
            <form onsubmit="saveNewEmployee(event)">
                <div class="field">
                    <label>Nume *</label>
                    <input type="text" id="add-name" required>
                </div>
                <div class="field" id="add-group-wrap">
                    <label>Grupă</label>
                    <select id="add-group">
                        <option value="">Fără grupă</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="field" id="add-dept-wrap" style="display:none;">
                    <label>Departament</label>
                    <select id="add-dept"></select>
                </div>
                <div class="field">
                    <label>Program implicit L-V</label>
                    <select id="add-shift">
                        <option value="07:00">07:00 (L-V), Vrij (S-D)</option>
                        <option value="08:00">08:00 (L-V), Vrij (S-D)</option>
                        <option value="Vrij">Vrij toată săptămâna</option>
                        <option value="">Gol (-)</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeAddModal()">Anulează</button>
                    <button type="submit" class="btn btn-primary">Adaugă</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const NL_DAYS = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag", "Zondag"];
        const RO_DAYS = ["Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă", "Duminică"];
        const MONTHS = ["Ian", "Feb", "Mar", "Apr", "Mai", "Iun", "Iul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const STORAGE_KEY = "program_munca_2026_2027_v7";

        const BASE_W47 = [
            { id: "w47-1", name: "Daniel", group: "", department: "General", shifts: [{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"Vrij",end:""},{begin:"Vrij",end:""}] },
            { id: "w47-2", name: "Druvis", group: "", department: "General", shifts: [{begin:"Vrij",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"09:00",end:""},{begin:"Vrij",end:""}] },
            { id: "w47-3", name: "Ghenadie", group: "", department: "General", shifts: [{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"Vrij",end:""},{begin:"Vrij",end:""}] },
            { id: "w47-4", name: "Evelina", group: "A", department: "General", shifts: [{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"Vrij",end:""},{begin:"Vrij",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""}] },
            { id: "w47-5", name: "Andrei", group: "B", department: "General", shifts: [{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:"Extra"},{begin:"Vrij",end:""}] },
            { id: "w47-6", name: "Albert", group: "C", department: "General", shifts: [{begin:"Vakantie",end:""},{begin:"Vakantie",end:""},{begin:"Vakantie",end:""},{begin:"Vakantie",end:""},{begin:"Vakantie",end:""},{begin:"Vakantie",end:""},{begin:"Vakantie",end:""}] },
            { id: "w47-7", name: "Iulian", group: "A", department: "General", shifts: [{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:"Extra"},{begin:"Vrij",end:""},{begin:"08:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""}] }
        ];

        function pad2(n) { return String(n).padStart(2, "0"); }
        function fmtDate(d) { return `${pad2(d.getDate())}-${pad2(d.getMonth() + 1)}-${d.getFullYear()}`; }
        function fmtShort(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }

        function firstMonday(year) {
            const d = new Date(year, 0, 1);
            const day = d.getDay();
            const diff = day === 0 ? 1 : (day === 1 ? 0 : 8 - day);
            d.setDate(d.getDate() + diff);
            d.setHours(12, 0, 0, 0);
            return d;
        }

        function buildYear(year) {
            const map = {};
            const mon = firstMonday(year);
            for (let i = 0; i < 53; i++) {
                const start = new Date(mon);
                start.setDate(mon.getDate() + i * 7);
                if (i > 0 && start.getFullYear() > year) break;
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                const wNum = i + 1;
                const id = `y${year}-w${wNum}`;
                const days = [];
                for (let k = 0; k < 7; k++) {
                    const cur = new Date(start);
                    cur.setDate(start.getDate() + k);
                    days.push({ ro: RO_DAYS[k], nl: NL_DAYS[k], date: fmtDate(cur), shortDate: fmtShort(cur) });
                }
                map[id] = {
                    id, year, weekNumber: wNum,
                    title: `Week ${wNum}`,
                    subtitle: `${fmtShort(start)} - ${fmtShort(end)} ${year}`,
                    hasGroupColumn: true,
                    hasDepartments: false,
                    activeGroups: ["AB", "AB", "BC", "BC", "AC", "AC", "AB"],
                    note: "",
                    days,
                    employees: BASE_W47.map(e => ({
                        id: `${id}-${e.name.toLowerCase()}`,
                        name: e.name,
                        group: e.group,
                        department: e.department,
                        shifts: e.shifts.map(s => ({ ...s }))
                    }))
                };
            }
            return map;
        }

        function buildInitialData() {
            const d = { ...buildYear(2026), ...buildYear(2027) };
            if (d["y2026-w47"]) {
                d["y2026-w47"].note = "Albert vakantie 18-11-2026 > 21-11-2026";
                d["y2026-w47"].employees = JSON.parse(JSON.stringify(BASE_W47));
            }
            const depts = ["General / Fără categorie", "Edeka / Superunie", "Daghandel", "Binnenkomst / Kleinpak 3", "Metro/Real", "TAS"];
            if (d["y2026-w51"]) {
                d["y2026-w51"].hasGroupColumn = false;
                d["y2026-w51"].hasDepartments = true;
                d["y2026-w51"].activeGroups = null;
                d["y2026-w51"].departments = depts;
                d["y2026-w51"].employees = [
                    { id: "w51-1", name: "Anneke", group: "", department: "General / Fără categorie", shifts: [{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"Vrij",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"",end:""}] },
                    { id: "w51-2", name: "Serge", group: "", department: "General / Fără categorie", shifts: [{begin:"",end:""},{begin:"",end:""},{begin:"",end:""},{begin:"",end:""},{begin:"",end:""},{begin:"11:00",end:""},{begin:"",end:""}] },
                    { id: "w51-3", name: "Sander", group: "", department: "General / Fără categorie", shifts: [{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"",end:""}] },
                    { id: "w51-4", name: "Franny", group: "", department: "General / Fără categorie", shifts: [{begin:"",end:""},{begin:"",end:""},{begin:"",end:""},{begin:"",end:""},{begin:"",end:""},{begin:"07:00",end:""},{begin:"",end:""}] },
                    { id: "w51-5", name: "Wesley", group: "", department: "General / Fără categorie", shifts: [{begin:"Vrij",end:""},{begin:"08:00",end:""},{begin:"07:00",end:""},{begin:"08:00",end:""},{begin:"07:00",end:""},{begin:"Vrij",end:""},{begin:"",end:""}] },
                    { id: "w51-6", name: "Devin", group: "", department: "General / Fără categorie", shifts: [{begin:"11:00",end:""},{begin:"13:00",end:""},{begin:"11:00",end:""},{begin:"13:00",end:""},{begin:"13:00",end:""},{begin:"Vrij",end:""},{begin:"",end:""}] },
                    { id: "w51-7", name: "Daniel", group: "", department: "Edeka / Superunie", shifts: [{begin:"08:00",end:""},{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"10:00",end:""},{begin:"07:00",end:""},{begin:"",end:""}] },
                    { id: "w51-8", name: "Serghei", group: "", department: "Edeka / Superunie", shifts: [{begin:"Vrij",end:""},{begin:"Vrij",end:""},{begin:"07:00",end:""},{begin:"08:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"",end:""}] },
                    { id: "w51-9", name: "Krys", group: "", department: "Edeka / Superunie", shifts: [{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"07:00",end:""},{begin:"Vrij",end:""},{begin:"07:00",end:""},{begin:"",end:""}] },

                    { id: "w52-18", name: "Alina", group: "", department: "TAS", shifts: [{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""},{begin:"Vrij",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""}] },

                    { id: "w52-21", name: "Rado", group: "", department: "TAS", shifts: [{begin:"08:00",end:""},{begin:"Vrij",end:""},{begin:"Vrij",end:""},{begin:"08:00",end:""},{begin:"Vrij",end:""},{begin:"08:00",end:""},{begin:"08:00",end:""}] }

        let scheduleData = {};
        let activeWeekId = "y2026-w47";
        let isFs = false;
        let rotDir = "ccw";
        let editCtx = null;

        function loadSaved() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Object.keys(parsed).length > 0) {
                        scheduleData = parsed;
                        if (!scheduleData[activeWeekId]) activeWeekId = Object.keys(scheduleData)[0];
                        return;
                    }
                }
            } catch (e) {}
            scheduleData = buildInitialData();
        }

        function persist() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scheduleData)); } catch (e) {}
        }

        function isWork(s) {
            if (!s || !s.begin) return false;
            const v = s.begin.trim().toLowerCase();
            return v !== "" && v !== "-" && v !== "vrij" && v !== "vakantie";
        }

        function shiftClass(s) {
            const b = (s && s.begin ? s.begin : "").trim();
            const l = b.toLowerCase();
            if (!b || b === "-") return "s-empty";
            if (l === "vrij") return "s-vrij";
            if (l === "vakantie") return "s-vac";
            if (b.startsWith("06:")) return "s-06";
            if (b.startsWith("07:")) return "s-07";
            if (b.startsWith("08:") || b.startsWith("09:")) return "s-08";
            return "s-10";
        }

        function onYearChange() {
            const y = parseInt(document.getElementById("year-select").value, 10);
            const cur = scheduleData[activeWeekId];
            const target = Object.values(scheduleData).find(w => w.year === y && w.weekNumber === (cur ? cur.weekNumber : 1))
                || Object.values(scheduleData).find(w => w.year === y);
            if (target) switchWeek(target.id);
        }

        function switchWeek(id) {
            if (!scheduleData[id]) return;
            activeWeekId = id;
            renderFilters();
            renderAll();
        }

        function renderFilters() {
            const w = scheduleData[activeWeekId];
            document.getElementById("year-select").value = String(w.year);
            const yWeeks = Object.values(scheduleData).filter(x => x.year === w.year);
            document.getElementById("week-select").innerHTML = yWeeks.map(x =>
                `<option value="${x.id}" ${x.id === activeWeekId ? "selected" : ""}>${x.title} (${x.subtitle})</option>`
            ).join("");

            document.getElementById("week-tabs").innerHTML = yWeeks.map(x =>
                `<button type="button" class="week-tab ${x.id === activeWeekId ? "active" : ""}" onclick="switchWeek('${x.id}')">${x.title}</button>`
            ).join("");

            let deptHtml = `<option value="ALL">Toate grupele / departamentele</option>`;
            if (w.hasGroupColumn) {
                deptHtml += `<option value="A">Grupa A</option><option value="B">Grupa B</option><option value="C">Grupa C</option>`;
            } else if (w.departments) {
                w.departments.forEach(d => { deptHtml += `<option value="${d}">${d}</option>`; });
            }
            document.getElementById("dept-filter").innerHTML = deptHtml;

            document.getElementById("day-filter").innerHTML = `<option value="ALL">Toate zilele</option>` +
                w.days.map((d, i) => `<option value="${i}">${d.ro} (${d.shortDate})</option>`).join("");
        }

        function getFiltered() {
            const w = scheduleData[activeWeekId];
            const q = document.getElementById("search-input").value.trim().toLowerCase();
            const df = document.getElementById("dept-filter").value;
            const dayF = document.getElementById("day-filter").value;
            const sf = document.getElementById("status-filter").value;

            return w.employees.filter(emp => {
                if (q && !emp.name.toLowerCase().includes(q)) return false;
                if (df !== "ALL") {
                    if (w.hasGroupColumn && emp.group !== df) return false;
                    if (!w.hasGroupColumn && emp.department !== df) return false;
                }
                if (sf !== "ALL") {
                    const checkShift = s => {
                        const b = (s.begin || "").trim().toLowerCase();
                        const e = (s.end || "").trim().toLowerCase();
                        if (sf === "WORKING") return isWork(s);
                        if (sf === "VRIJ") return b === "vrij";
                        if (sf === "SPECIAL") return b === "vakantie" || e.includes("extra") || e.includes("tas");
                        return true;
                    };
                    if (dayF !== "ALL") {
                        if (!checkShift(emp.shifts[parseInt(dayF, 10)])) return false;
                    } else if (!emp.shifts.some(checkShift)) {
                        return false;
                    }
                }
                return true;
            });
        }

        function renderStats() {
            const w = scheduleData[activeWeekId];
            let shifts = 0, vrij = 0, special = 0;
            w.employees.forEach(e => e.shifts.forEach(s => {
                if (isWork(s)) shifts++;
                const b = (s.begin || "").trim().toLowerCase();
                const end = (s.end || "").trim().toLowerCase();
                if (b === "vrij") vrij++;
                if (b === "vakantie" || end.includes("extra") || end.includes("tas")) special++;
            }));
            document.getElementById("stat-people").textContent = w.employees.length;
            document.getElementById("stat-shifts").textContent = shifts;
            document.getElementById("stat-vrij").textContent = vrij;
            document.getElementById("stat-special").textContent = special;

            const nb = document.getElementById("note-banner");
            if (w.note) {
                nb.style.display = "block";
                nb.textContent = "Notă: " + w.note;
            } else {
                nb.style.display = "none";
            }
        }

        function renderTable() {
            const w = scheduleData[activeWeekId];
            const list = getFiltered();

            let th = `<tr><th class="sticky-col">Persoană</th>`;
            if (w.hasGroupColumn) th += `<th>Grp</th>`;
            w.days.forEach(d => {
                th += `<th>${d.ro}<br><span style="font-size:11px; font-weight:400;">${d.shortDate}</span></th>`;
            });
            th += `</tr>`;
            document.getElementById("thead").innerHTML = th;

            let tb = "";
            const renderEmp = emp => {
                let r = `<tr><td class="sticky-col">${emp.name} <button type="button" class="btn" style="padding:2px 6px; font-size:11px; margin-left:4px;" onclick="deleteEmp('${emp.id}')">✕</button></td>`;
                if (w.hasGroupColumn) r += `<td style="text-align:center; font-weight:700;">${emp.group || "-"}</td>`;
                emp.shifts.forEach((s, idx) => {
                    const lbl = (s.begin && s.begin.trim()) || "-";
                    const extra = s.end ? `<br><span class="extra-tag">${s.end}</span>` : "";
                    r += `<td><div class="shift-cell ${shiftClass(s)}" onclick="openEdit('${emp.id}', ${idx})">${lbl}${extra}</div></td>`;
                });
                return r + `</tr>`;
            };

            if (w.hasDepartments) {
                (w.departments || []).forEach(dept => {
                    const grp = list.filter(e => e.department === dept);
                    if (grp.length) {
                        tb += `<tr class="dept-row"><td colspan="${w.days.length + 1}">${dept}</td></tr>`;
                        grp.forEach(e => { tb += renderEmp(e); });
                    }
                });
            } else {
                list.forEach(e => { tb += renderEmp(e); });
            }
            document.getElementById("tbody").innerHTML = tb || `<tr><td colspan="9" style="text-align:center; padding:24px;">Nicio înregistrare.</td></tr>`;

            const totals = w.days.map((_, i) => list.reduce((acc, e) => acc + (isWork(e.shifts[i]) ? 1 : 0), 0));
            let tf = `<tr><td class="sticky-col">TOTAL (${totals.reduce((a,b)=>a+b,0)})</td>`;
            if (w.hasGroupColumn) tf += `<td>-</td>`;
            totals.forEach(c => { tf += `<td style="text-align:center; font-weight:800;">${c}</td>`; });
            tf += `</tr>`;
            document.getElementById("tfoot").innerHTML = tf;
        }

        function renderAll() {
            renderStats();
            renderTable();
        }

        function applyFsClasses() {
            const body = document.getElementById("app-body");
            body.classList.remove("fs-active", "rot-ccw", "rot-cw");
            if (isFs) {
                body.classList.add("fs-active", rotDir === "cw" ? "rot-cw" : "rot-ccw");
            }
            document.querySelectorAll(".modal-card").forEach(mc => {
                mc.classList.remove("rot-ccw", "rot-cw");
                if (isFs) mc.classList.add(rotDir === "cw" ? "rot-cw" : "rot-ccw");
            });
        }

        function toggleFullscreen() {
            if (!isFs) {
                isFs = true;
                rotDir = "ccw";
            } else {
                rotDir = rotDir === "ccw" ? "cw" : "ccw";
            }
            applyFsClasses();
        }

        function rotateFullscreen() {
            rotDir = rotDir === "ccw" ? "cw" : "ccw";
            applyFsClasses();
        }

        function exitFullscreen() {
            isFs = false;
            applyFsClasses();
        }

        function openEdit(empId, dayIdx) {
            const w = scheduleData[activeWeekId];
            const emp = w.employees.find(e => e.id === empId);
            if (!emp) return;
            editCtx = { empId, dayIdx };
            const s = emp.shifts[dayIdx];
            document.getElementById("edit-title").textContent = `${emp.name} — ${w.days[dayIdx].ro}`;
            document.getElementById("edit-sub").textContent = `${w.title} (${w.days[dayIdx].date})`;
            document.getElementById("edit-begin").value = s.begin || "";
            document.getElementById("edit-end").value = s.end || "";
            applyFsClasses();
            document.getElementById("edit-modal").classList.add("open");
        }

        function setPreset(b, e) {
            document.getElementById("edit-begin").value = b;
            document.getElementById("edit-end").value = e;
        }

        function saveEdit(ev) {
            ev.preventDefault();
            if (!editCtx) return;
            const w = scheduleData[activeWeekId];
            const emp = w.employees.find(e => e.id === editCtx.empId);
            if (emp) {
                emp.shifts[editCtx.dayIdx] = {
                    begin: document.getElementById("edit-begin").value.trim(),
                    end: document.getElementById("edit-end").value.trim()
                };
                persist();
                renderAll();
            }
            closeEditModal();
        }

        function closeEditModal() {
            document.getElementById("edit-modal").classList.remove("open");
            editCtx = null;
        }

        function openAddModal() {
            const w = scheduleData[activeWeekId];
            document.getElementById("add-name").value = "";
            if (w.hasGroupColumn) {
                document.getElementById("add-group-wrap").style.display = "block";
                document.getElementById("add-dept-wrap").style.display = "none";
            } else {
                document.getElementById("add-group-wrap").style.display = "none";
                document.getElementById("add-dept-wrap").style.display = "block";
                document.getElementById("add-dept").innerHTML = (w.departments || ["General"]).map(d => `<option value="${d}">${d}</option>`).join("");
            }
            applyFsClasses();
            document.getElementById("add-modal").classList.add("open");
        }

        function closeAddModal() {
            document.getElementById("add-modal").classList.remove("open");
        }

        function saveNewEmployee(ev) {
            ev.preventDefault();
            const name = document.getElementById("add-name").value.trim();
            if (!name) return;
            const w = scheduleData[activeWeekId];
            const def = document.getElementById("add-shift").value;
            const shifts = Array.from({ length: 7 }, (_, i) =>
                (def === "07:00" || def === "08:00") ? (i < 5 ? { begin: def, end: "" } : { begin: "Vrij", end: "" }) : { begin: def, end: "" }
            );
            w.employees.push({
                id: `${w.id}-${Date.now()}`,
                name,
                group: w.hasGroupColumn ? document.getElementById("add-group").value : "",
                department: w.hasDepartments ? document.getElementById("add-dept").value : "General",
                shifts
            });
            persist();
            closeAddModal();
            renderAll();
        }

        function deleteEmp(empId) {
            const w = scheduleData[activeWeekId];
            w.employees = w.employees.filter(e => e.id !== empId);
            persist();
            renderAll();
        }

        function resetAllData() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            scheduleData = buildInitialData();
            activeWeekId = "y2026-w47";
            renderFilters();
            renderAll();
        }

        function exportCSV() {
            const w = scheduleData[activeWeekId];
            const lines = [["An", "Saptamana", "Persoana", ...w.days.map(d => d.ro)].join(",")];
            w.employees.forEach(e => {
                lines.push([w.year, w.title, e.name, ...e.shifts.map(s => `"${s.begin || "-"}${s.end ? ` [${s.end}]` : ""}"`)].join(","));
            });
            const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${w.title}_${w.year}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        loadSaved();
        renderFilters();
        renderAll();
    </script>
