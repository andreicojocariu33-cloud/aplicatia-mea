    <style>
        /* =====================================================================
           1. DESIGN TOKENS & BASE STYLES (100% SELF-CONTAINED)
           ===================================================================== */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --indigo-50: #eef2ff;
            --indigo-100: #e0e7ff;
            --indigo-200: #c7d2fe;
            --indigo-600: #4f46e5;
            --indigo-700: #4338ca;

            --amber-50: #fffbeb;
            --amber-100: #fef3c7;
            --amber-200: #fde68a;
            --amber-700: #b45309;
            --amber-800: #92400e;

            --emerald-50: #ecfdf5;
            --emerald-200: #a7f3d0;
            --emerald-700: #047857;
            --emerald-800: #065f46;

            --rose-50: #fff1f2;
            --rose-100: #ffe4e6;
            --rose-200: #fecdd3;
            --rose-600: #e11d48;
            --rose-700: #be123c;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-xl: 0 20px 35px -10px rgba(15, 23, 42, 0.25);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            direction: ltr;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            line-height: 1.4;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        body.fullscreen-schedule-active {
            overflow: hidden !important;
        }

        button, select, input {
            font-family: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* =====================================================================
           2. HEADER & NAVIGATION CONTROLS
           ===================================================================== */
        .app-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 30;
            padding: 12px 16px;
        }

        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 10px;
            margin-left: -10px;
            border-radius: 14px;
            transition: background-color 0.2s ease, transform 0.15s ease;
            user-select: none;
            background: transparent;
            border: none;
            text-align: left;
        }

        .brand-trigger:hover {
            background-color: var(--indigo-50);
        }

        .brand-trigger:active {
            transform: scale(0.99);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--indigo-600), var(--indigo-700));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.28);
        }

        .brand-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: underline;
            text-decoration-color: var(--indigo-200);
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        .brand-trigger:hover .brand-title {
            color: var(--indigo-700);
        }

        .year-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--indigo-50);
            color: var(--indigo-700);
            border: 1px solid var(--indigo-200);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .week-navigator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-subtle);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f8fafc;
            border-color: var(--border-strong);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-icon {
            padding: 8px;
        }

        .btn-primary {
            background: var(--indigo-600);
            color: #ffffff;
            border-color: var(--indigo-600);
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background: var(--indigo-700);
            border-color: var(--indigo-700);
        }

        .btn-soft-indigo {
            background: var(--indigo-50);
            color: var(--indigo-700);
            border-color: var(--indigo-200);
        }

        .btn-soft-indigo:hover {
            background: var(--indigo-100);
        }

        .btn-whatsapp {
            background: #16a34a;
            color: #ffffff;
            border-color: #15803d;
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.22);
        }

        .btn-whatsapp:hover {
            background: #15803d;
            border-color: #166534;
        }

        .btn-email {
            background: #0284c7;
            color: #ffffff;
            border-color: #0369a1;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.22);
        }

        .btn-email:hover {
            background: #0369a1;
            border-color: #075985;
        }

        .btn-danger-soft {
            background: var(--rose-50);
            color: var(--rose-700);
            border-color: var(--rose-200);
        }

        .btn-danger-soft:hover {
            background: var(--rose-100);
        }

        .select-control {
            padding: 7px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .select-control:focus {
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* =====================================================================
           3. LEGEND, SHARE ACTIONS & STATS BAR
           ===================================================================== */
        .sub-toolbar {
            max-width: 1600px;
            width: 100%;
            margin: 12px auto 0;
            padding: 0 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .legend-list {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 0.73rem;
        }

        .legend-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .right-toolbar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .share-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stats-bar strong {
            color: var(--text-main);
            font-weight: 800;
        }

        /* =====================================================================
           4. SCHEDULE TABLE CONTAINER (MONDAY - SUNDAY)
           ===================================================================== */
        .main-workspace {
            flex: 1;
            max-width: 1600px;
            width: 100%;
            margin: 12px auto 20px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
        }

        #fullscreen-overlay-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #fullscreen-rotated-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            position: relative;
        }

        #fullscreen-top-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 14px;
            background: #0f172a;
            color: #ffffff;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        #fullscreen-overlay-shell.active #fullscreen-top-bar {
            display: flex;
        }

        .fs-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .fs-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .fs-btn {
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f8fafc;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .fs-btn:hover {
            background: #334155;
        }

        .fs-btn-wa {
            background: #16a34a;
            border-color: #15803d;
            color: #ffffff;
        }

        .fs-btn-wa:hover {
            background: #15803d;
        }

        .fs-btn-mail {
            background: #0284c7;
            border-color: #0369a1;
            color: #ffffff;
        }

        .fs-btn-mail:hover {
            background: #0369a1;
        }

        .fs-btn-exit {
            background: #e11d48;
            border-color: #e11d48;
            color: #ffffff;
        }

        .fs-btn-exit:hover {
            background: #be123c;
        }

        #table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
        }

        table.schedule-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 760px;
            direction: ltr;
        }

        col.col-employee { width: 19%; }
        col.col-day      { width: 10.4%; }
        col.col-days-cnt { width: 8.2%; }

        .schedule-table thead th {
            position: sticky;
            top: 0;
            z-index: 15;
            background: #f1f5f9;
            border-bottom: 2px solid var(--border-strong);
            border-right: 1px solid var(--border-color);
            padding: 10px 4px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .schedule-table thead th.sticky-col {
            position: sticky;
            left: 0;
            z-index: 25;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            padding-left: 12px;
            background: var(--indigo-600);
            color: #ffffff;
            border-right: 2px solid var(--indigo-700);
        }

        .schedule-table thead th.weekend-col {
            background: var(--amber-100);
            color: var(--amber-800);
            border-bottom-color: #f59e0b;
        }

        .schedule-table thead th.today-col {
            background: var(--indigo-100);
            color: var(--indigo-700);
            border-bottom-color: var(--indigo-600);
        }

        .day-name {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .day-date {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.85;
            margin-top: 2px;
        }

        .schedule-table tbody td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 5px 4px;
            vertical-align: middle;
            text-align: center;
            height: 64px;
        }

        .schedule-table tbody tr:hover td {
            background-color: #f8fafc;
        }

        .schedule-table tbody td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            direction: ltr;
            unicode-bidi: isolate;
            background: linear-gradient(90deg, var(--indigo-50) 0%, #ffffff 100%);
            text-align: left;
            padding: 6px 8px 6px 12px;
            border-left: 4px solid var(--indigo-600);
            border-right: 2px solid var(--indigo-200);
            box-shadow: 2px 0 6px rgba(79, 70, 229, 0.08);
        }

        .schedule-table tbody tr:hover td.sticky-col {
            background: linear-gradient(90deg, var(--indigo-100) 0%, var(--indigo-50) 100%);
        }

        .emp-cell-wrap {
            display: flex;
            flex-direction: row;
            direction: ltr;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .emp-info {
            min-width: 0;
            flex: 1;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
        }

        .emp-name {
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            font-size: 0.96rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: #1e1b4b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .emp-role {
            display: inline-block;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            font-size: 0.68rem;
            font-weight: 800;
            color: #ffffff;
            background: var(--indigo-600);
            border: 1px solid var(--indigo-700);
            border-radius: 6px;
            padding: 1px 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
            max-width: 100%;
        }

        .emp-del-btn {
            opacity: 0;
            background: var(--rose-50);
            color: var(--rose-600);
            border: 1px solid var(--rose-200);
            border-radius: 6px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.15s ease;
        }

        .schedule-table tbody tr:hover .emp-del-btn {
            opacity: 1;
        }

        .schedule-table tbody td.weekend-cell {
            background-color: rgba(254, 243, 199, 0.28);
        }

        .shift-slot {
            width: 100%;
            height: 100%;
            min-height: 46px;
            border-radius: 10px;
            padding: 4px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.1s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            user-select: none;
        }

        .shift-slot:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08);
        }

        .shift-empty {
            border: 1px dashed #cbd5e1;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.6);
            font-size: 0.72rem;
            font-weight: 600;
        }
