<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificator Ture & Program de Lucru</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#172033',
                            950: '#0a0f1c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
        }

        .sticky-thead th {
            position: sticky;
            top: 0;
            z-index: 15;
        }
        .sticky-thead th.sticky-col {
            z-index: 25;
        }

        body.fullscreen-schedule-active {
            overflow: hidden !important;
        }

        #fullscreen-overlay-shell.active {
            position: fixed;
            inset: 0;
            z-index: 45;
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            background: #0f172a;
            overflow: hidden;
        }

        #fullscreen-rotated-stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            overflow: hidden;
            transition: transform 0.25s ease;
        }

        #fullscreen-overlay-shell.active.rotated-ccw #fullscreen-rotated-stage,
        #fullscreen-overlay-shell.active.rotated-cw #fullscreen-rotated-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh;
            width: 100dvh;
            height: 100vw;
            height: 100dvw;
        }

        #fullscreen-overlay-shell.active.rotated-ccw #fullscreen-rotated-stage {
            transform: translate(-50%, -50%) rotate(-90deg);
        }

        #fullscreen-overlay-shell.active.rotated-cw #fullscreen-rotated-stage {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        /* Fit-to-screen full 7 days without horizontal scrolling in fullscreen mode */
        #fullscreen-overlay-shell.active #table-scroll-wrapper {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            width: 100% !important;
            max-width: 100% !important;
        }

        #fullscreen-overlay-shell.active table {
            width: 100% !important;
            max-width: 100% !important;
            table-layout: fixed !important;
        }

        /* Evidențiere clară a numelui angajatului în modul 90° tot ecranul */
        #fullscreen-overlay-shell.active td.sticky-col {
            background: linear-gradient(90deg, #eef2ff 0%, #ffffff 100%) !important;
            border-right: 2px solid #6366f1 !important;
            box-shadow: 2px 0 8px rgba(79, 70, 229, 0.12);
        }

        #fullscreen-overlay-shell.active tr:hover td.sticky-col {
            background: linear-gradient(90deg, #e0e7ff 0%, #f8fafc 100%) !important;
        }

        /* Ascunde complet bara și butoanele pe telefon în modul tot ecranul */
        @media (max-width: 767px) {
            #fullscreen-overlay-shell.active #fullscreen-top-bar,
            #fullscreen-overlay-shell.active .no-print {
                display: none !important;
            }
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 11px !important;
            }
            .no-print {
                display: none !important;
            }
            .print-full {
                width: 100% !important;
                max-width: none !important;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            table {
                border-collapse: collapse !important;
                width: 100% !important;
            }
            th, td {
                border: 1px solid #cbd5e1 !important;
                padding: 4px 6px !important;
            }
            .sticky-col {
                position: static !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Notificare Toast -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Principal -->
    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print transition-all">
        <div class="w-full max-w-none px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                <!-- Logo și Titlu Interactiv "Programul de muncă" -->
                <div class="flex items-center justify-between gap-3">
                    <div onclick="enterFullscreenSchedule()" role="button" tabindex="0" onkeydown="if(event.key==='Enter') enterFullscreenSchedule()"
                        title="Click pentru a deschide Programul de muncă la 90° pe tot ecranul"
                        class="flex items-center gap-3 group cursor-pointer rounded-xl p-1 -ml-1 hover:bg-indigo-50/70 transition">
                        <div class="w-10 h-10 rounded-xl bg-indigo-600 group-hover:bg-indigo-700 text-white flex items-center justify-center shadow-md shadow-indigo-200 shrink-0 transition">
                            <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 group-hover:text-indigo-700 tracking-tight underline decoration-indigo-300 decoration-2 underline-offset-4 transition">
                                    Programul de muncă
                                </h1>
                                <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                                    2026 & 2027
                                </span>
                            </div>
                            <p id="header-subtitle" class="text-xs text-slate-500">Click pe „Programul de muncă” pentru deschidere directă la 90°</p>
                        </div>
                    </div>
                </div>

                <!-- Selector Rapid An + Săptămână -->
                <div class="flex items-center gap-2">
                    <select id="quick-year-select" onchange="onYearOrWeekDropdownChange()"
                        class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-800 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor
