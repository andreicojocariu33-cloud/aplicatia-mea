<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificator Ture & Program de Lucru</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#172033',
                            950: '#0a0f1c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
        }

        .sticky-thead th {
            position: sticky;
            top: 0;
            z-index: 15;
        }
        .sticky-thead th.sticky-col {
            z-index: 25;
        }

        body.fullscreen-schedule-active {
            overflow: hidden !important;
        }

        #fullscreen-overlay-shell.active {
            position: fixed;
            inset: 0;
            z-index: 45;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            overflow: hidden;
        }

        #fullscreen-rotated-stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            overflow: hidden;
            transition: transform 0.25s ease;
        }

        #fullscreen-overlay-shell.active.rotated-ccw #fullscreen-rotated-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(-90deg);
        }

        #fullscreen-overlay-shell.active.rotated-cw #fullscreen-rotated-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 11px !important;
            }
            .no-print {
                display: none !important;
            }
            .print-full {
                width: 100% !important;
                max-width: none !important;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            table {
                border-collapse: collapse !important;
                width: 100% !important;
            }
            th, td {
                border: 1px solid #cbd5e1 !important;
                padding: 4px 6px !important;
            }
            .sticky-col {
                position: static !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Notificare Toast -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Principal -->
    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print transition-all">
        <div class="w-full max-w-none px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                <!-- Logo și Titlu Interactiv "Programul de muncă" -->
                <div class="flex items-center justify-between gap-3">
                    <div onclick="enterFullscreenSchedule()" role="button" tabindex="0" onkeydown="if(event.key==='Enter') enterFullscreenSchedule()"
                        title="Click pentru a deschide Programul de muncă pe tot ecranul și întors invers"
                        class="flex items-center gap-3 group cursor-pointer rounded-xl p-1 -ml-1 hover:bg-indigo-50/7
