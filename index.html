<!DOCTYPE html>
<html lang="ro" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programul de muncă (2026 &amp; 2027)</title>
    <style>
        /* =====================================================================
           1. DESIGN TOKENS & BASE STYLES (100% SELF-CONTAINED)
           ===================================================================== */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --indigo-50: #eef2ff;
            --indigo-100: #e0e7ff;
            --indigo-200: #c7d2fe;
            --indigo-600: #4f46e5;
            --indigo-700: #4338ca;

            --amber-50: #fffbeb;
            --amber-100: #fef3c7;
            --amber-200: #fde68a;
            --amber-700: #b45309;
            --amber-800: #92400e;

            --emerald-50: #ecfdf5;
            --emerald-200: #a7f3d0;
            --emerald-700: #047857;
            --emerald-800: #065f46;

            --rose-50: #fff1f2;
            --rose-100: #ffe4e6;
            --rose-200: #fecdd3;
            --rose-600: #e11d48;
            --rose-700: #be123c;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-xl: 0 20px 35px -10px rgba(15, 23, 42, 0.25);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            direction: ltr;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            line-height: 1.4;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        body.fullscreen-schedule-active {
            overflow: hidden !important;
        }

        button, select, input {
            font-family: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* =====================================================================
           2. HEADER & NAVIGATION CONTROLS
           ===================================================================== */
        .app-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 30;
            padding: 12px 16px;
        }

        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 10px;
            margin-left: -10px;
            border-radius: 14px;
            transition: background-color 0.2s ease, transform 0.15s ease;
            user-select: none;
            background: transparent;
            border: none;
            text-align: left;
        }

        .brand-trigger:hover {
            background-color: var(--indigo-50);
        }

        .brand-trigger:active {
            transform: scale(0.99);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--indigo-600), var(--indigo-700));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.28);
            overflow: hidden;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: underline;
            text-decoration-color: var(--indigo-200);
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        .brand-trigger:hover .brand-title {
            color: var(--indigo-700);
        }

        .year-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--indigo-50);
            color: var(--indigo-700);
            border: 1px solid var(--indigo-200);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .week-navigator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-subtle);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f8fafc;
            border-color: var(--border-strong);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-icon {
            padding: 8px;
        }

        .btn-primary {
            background: var(--indigo-600);
            color: #ffffff;
            border-color: var(--indigo-600);
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background: var(--indigo-700);
            border-color: var(--indigo-700);
        }

        .btn-soft-indigo {
            background: var(--indigo-50);
            color: var(--indigo-700);
            border-color: var(--indigo-200);
        }

        .btn-soft-indigo:hover {
            background: var(--indigo-100);
        }

        .btn-whatsapp {
            background: #16a34a;
            color: #ffffff;
            border-color: #15803d;
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.22);
        }

        .btn-whatsapp:hover {
            background: #15803d;
            border-color: #166534;
        }

        .btn-email {
            background: #0284c7;
            color: #ffffff;
            border-color: #0369a1;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.22);
        }

        .btn-email:hover {
            background: #0369a1;
            border-color: #075985;
        }

        .btn-danger-soft {
            background: var(--rose-50);
            color: var(--rose-700);
            border-color: var(--rose-200);
        }

        .btn-danger-soft:hover {
            background: var(--rose-100);
        }

        .select-control {
            padding: 7px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .select-control:focus {
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* =====================================================================
           3. LEGEND, SHARE ACTIONS & STATS BAR
           ===================================================================== */
        .sub-toolbar {
            max-width: 1600px;
            width: 100%;
            margin: 12px auto 0;
            padding: 0 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .legend-list {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 0.73rem;
        }

        .legend-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .right-toolbar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .share-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stats-bar strong {
            color: var(--text-main);
            font-weight: 800;
        }

        /* =====================================================================
           4. SCHEDULE TABLE CONTAINER (MONDAY - SUNDAY)
           ===================================================================== */
        .main-workspace {
            flex: 1;
            max-width: 1600px;
            width: 100%;
            margin: 12px auto 20px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
        }

        #fullscreen-overlay-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #fullscreen-rotated-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            position: relative;
        }

        #fullscreen-top-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 14px;
            background: #0f172a;
            color: #ffffff;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        #fullscreen-overlay-shell.active #fullscreen-top-bar {
            display: flex;
        }

        .fs-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .fs-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .fs-btn {
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f8fafc;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .fs-btn:hover {
            background: #334155;
        }

        .fs-btn-wa {
            background: #16a34a;
            border-color: #15803d;
            color: #ffffff;
        }

        .fs-btn-wa:hover {
            background: #15803d;
        }

        .fs-btn-mail {
            background: #0284c7;
            border-color: #0369a1;
            color: #ffffff;
        }

        .fs-btn-mail:hover {
            background: #0369a1;
        }

        .fs-btn-exit {
            background: #e11d48;
            border-color: #e11d48;
            color: #ffffff;
        }

        .fs-btn-exit:hover {
            background: #be123c;
        }

        #table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
        }

        table.schedule-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 760px;
            direction: ltr;
        }

        col.col-employee { width: 19%; }
        col.col-day      { width: 10.4%; }
        col.col-days-cnt { width: 8.2%; }

        .schedule-table thead th {
            position: sticky;
            top: 0;
            z-index: 15;
            background: #f1f5f9;
            border-bottom: 2px solid var(--border-strong);
            border-right: 1px solid var(--border-color);
            padding: 10px 4px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .schedule-table thead th.sticky-col {
            position: sticky;
            left: 0;
            z-index: 25;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            padding-left: 12px;
            background: var(--indigo-600);
            color: #ffffff;
            border-right: 2px solid var(--indigo-700);
        }

        .schedule-table thead th.weekend-col {
            background: var(--amber-100);
            color: var(--amber-800);
            border-bottom-color: #f59e0b;
        }

        .schedule-table thead th.today-col {
            background: var(--indigo-100);
            color: var(--indigo-700);
            border-bottom-color: var(--indigo-600);
        }

        .day-name {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .day-date {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.85;
            margin-top: 2px;
        }

        .schedule-table tbody td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 5px 4px;
            vertical-align: middle;
            text-align: center;
            height: 64px;
        }

        .schedule-table tbody tr:hover td {
            background-color: #f8fafc;
        }

        .schedule-table tbody td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            direction: ltr;
            unicode-bidi: isolate;
            background: linear-gradient(90deg, var(--indigo-50) 0%, #ffffff 100%);
            text-align: left;
            padding: 6px 8px 6px 12px;
            border-left: 4px solid var(--indigo-600);
            border-right: 2px solid var(--indigo-200);
            box-shadow: 2px 0 6px rgba(79, 70, 229, 0.08);
        }

        .schedule-table tbody tr:hover td.sticky-col {
            background: linear-gradient(90deg, var(--indigo-100) 0%, var(--indigo-50) 100%);
        }

        .emp-cell-wrap {
            display: flex;
            flex-direction: row;
            direction: ltr;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .emp-info {
            min-width: 0;
            flex: 1;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
        }

        .emp-name {
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            font-size: 0.96rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: #1e1b4b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .emp-role {
            display: inline-block;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            font-size: 0.68rem;
            font-weight: 800;
            color: #ffffff;
            background: var(--indigo-600);
            border: 1px solid var(--indigo-700);
            border-radius: 6px;
            padding: 1px 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
            max-width: 100%;
        }

        .emp-del-btn {
            opacity: 0;
            background: var(--rose-50);
            color: var(--rose-600);
            border: 1px solid var(--rose-200);
            border-radius: 6px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.15s ease;
        }

        .schedule-table tbody tr:hover .emp-del-btn {
            opacity: 1;
        }

        .schedule-table tbody td.weekend-cell {
            background-color: rgba(254, 243, 199, 0.28);
        }

        .shift-slot {
            width: 100%;
            height: 100%;
            min-height: 46px;
            border-radius: 10px;
            padding: 4px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.1s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            user-select: none;
        }

        .shift-slot:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08);
        }

        .shift-empty {
            border: 1px dashed #cbd5e1;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.6);
            font-size: 0.72rem;
            font-weight: 600;
        }

        .shift-empty:hover {
            border-color: var(--indigo-600);
            color: var(--indigo-600);
            background: var(--indigo-50);
        }

        .shift-work {
            background: var(--emerald-50);
            border-color: var(--emerald-200);
            color: var(--emerald-800);
        }

        .shift-extra {
            background: var(--amber-50);
            border-color: var(--amber-200);
            color: var(--amber-800);
        }

        .shift-vrij {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #475569;
        }

        .shift-vakantie {
            background: var(--rose-50);
            border-color: var(--rose-200);
            color: var(--rose-700);
        }

        .shift-title {
            font-size: 0.8rem;
            font-weight: 800;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .shift-sub {
            font-size: 0.64rem;
            font-weight: 700;
            opacity: 0.9;
            margin-top: 2px;
            white-space: nowrap;
        }

        .days-count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 800;
            background: var(--indigo-50);
            color: var(--indigo-700);
            border: 1px solid var(--indigo-200);
        }

        .schedule-table tfoot td {
            background: #f8fafc;
            border-top: 2px solid var(--border-strong);
            border-right: 1px solid var(--border-color);
            padding: 8px 4px;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .schedule-table tfoot td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            direction: ltr;
            unicode-bidi: isolate;
            background: #f1f5f9;
            text-align: left;
            padding-left: 12px;
            color: var(--text-main);
            border-right: 2px solid var(--border-strong);
        }

        /* =====================================================================
           5. 90-DEGREE ROTATED FULLSCREEN SCHEDULE MODE
           ===================================================================== */
        #fullscreen-overlay-shell.active {
            position: fixed;
            inset: 0;
            z-index: 50;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0f172a;
            overflow: hidden;
        }

        #fullscreen-overlay-shell.active #fullscreen-rotated-stage {
            border-radius: 0;
            border: none;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            transition: transform 0.25s ease;
        }

        #fullscreen-overlay-shell.active.rotated-ccw #fullscreen-rotated-stage,
        #fullscreen-overlay-shell.active.rotated-cw #fullscreen-rotated-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100dvh;
            height: 100vw;
            max-width: none;
            max-height: none;
        }

        #fullscreen-overlay-shell.active.rotated-ccw #fullscreen-rotated-stage {
            transform: translate(-50%, -50%) rotate(-90deg);
        }

        #fullscreen-overlay-shell.active.rotated-cw #fullscreen-rotated-stage {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        #fullscreen-overlay-shell.active #table-scroll-wrapper {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        #fullscreen-overlay-shell.active table.schedule-table {
            min-width: 0 !important;
            width: 100% !important;
            height: auto;
            table-layout: fixed !important;
            direction: ltr !important;
            border-collapse: collapse !important;
        }

        #fullscreen-overlay-shell.active col.col-employee { width: 26%; }
        #fullscreen-overlay-shell.active col.col-day      { width: 9.2%; }
        #fullscreen-overlay-shell.active col.col-days-cnt { width: 9.6%; }

        #fullscreen-overlay-shell.active .schedule-table thead th,
        #fullscreen-overlay-shell.active .schedule-table thead th.sticky-col,
        #fullscreen-overlay-shell.active .schedule-table tbody td,
        #fullscreen-overlay-shell.active .schedule-table tbody td.sticky-col,
        #fullscreen-overlay-shell.active .schedule-table tfoot td,
        #fullscreen-overlay-shell.active .schedule-table tfoot td.sticky-col {
            position: static !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            bottom: auto !important;
        }

        #fullscreen-overlay-shell.active .schedule-table thead th {
            padding: 5px 2px;
            font-size: 0.68rem;
        }

        #fullscreen-overlay-shell.active .schedule-table thead th.sticky-col {
            direction: ltr !important;
            unicode-bidi: isolate !important;
            text-align: left !important;
            padding-left: 8px;
            background: var(--indigo-600);
            color: #ffffff;
            border-right: 2px solid var(--indigo-700);
        }

        #fullscreen-overlay-shell.active .schedule-table tbody td {
            padding: 3px 2px;
            height: auto;
            min-height: 44px;
            overflow: visible;
        }

        #fullscreen-overlay-shell.active td.sticky-col {
            direction: ltr !important;
            unicode-bidi: isolate !important;
            text-align: left !important;
            background: linear-gradient(90deg, var(--indigo-100) 0%, #ffffff 100%) !important;
            border-left: 4px solid var(--indigo-600) !important;
            border-right: 2px solid var(--indigo-600) !important;
            padding: 4px 5px 4px 7px !important;
            box-shadow: 2px 0 8px rgba(79, 70, 229, 0.16);
        }

        #fullscreen-overlay-shell.active .emp-cell-wrap {
            display: flex !important;
            flex-direction: row !important;
            direction: ltr !important;
            justify-content: flex-start !important;
            align-items: center !important;
            width: 100%;
        }

        #fullscreen-overlay-shell.active .emp-info,
        #fullscreen-overlay-shell.active .emp-name,
        #fullscreen-overlay-shell.active .emp-role {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            direction: ltr !important;
            unicode-bidi: isolate !important;
            text-align: left !important;
            white-space: normal !important;
            overflow: visible !important;
            text-overflow: clip !important;
            word-break: normal;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        #fullscreen-overlay-shell.active .emp-name {
            font-size: 0.86rem;
            font-weight: 900;
            line-height: 1.15;
            color: #1e1b4b !important;
            background: rgba(255, 255, 255, 0.92);
            padding: 2px 4px;
            border-radius: 4px;
        }

        #fullscreen-overlay-shell.active .emp-role {
            display: inline-block !important;
            font-size: 0.62rem;
            font-weight: 800;
            line-height: 1.1;
            color: #ffffff !important;
            background: var(--indigo-600) !important;
            border: none !important;
            border-radius: 5px;
            padding: 1px 5px;
            margin-top: 2px;
        }

        #fullscreen-overlay-shell.active .emp-del-btn {
            display: none !important;
        }

        #fullscreen-overlay-shell.active .shift-slot {
            min-height: 36px;
            padding: 2px;
            border-radius: 7px;
        }

        #fullscreen-overlay-shell.active .shift-title {
            font-size: 0.68rem;
        }

        #fullscreen-overlay-shell.active .shift-sub {
            font-size: 0.56rem;
        }

        #fullscreen-overlay-shell.active .days-count-badge {
            padding: 3px 5px;
            font-size: 0.66rem;
        }

        @media (max-width: 767px) {
            #fullscreen-overlay-shell.active #fullscreen-top-bar {
                display: none !important;
            }
        }

        /* =====================================================================
           6. MODALS & TOAST NOTIFICATIONS
           ===================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        #fullscreen-rotated-stage .modal-backdrop {
            position: absolute;
            inset: 0;
            z-index: 75;
            padding: 10px;
        }

        #fullscreen-rotated-stage .modal-card {
            max-height: 92%;
            display: flex;
            flex-direction: column;
        }

        #fullscreen-rotated-stage .modal-body {
            padding: 12px 14px;
            gap: 10px;
            max-height: none;
            flex: 1;
            overflow-y: auto;
        }

        #fullscreen-rotated-stage .preset-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        #fullscreen-rotated-stage .preset-btn {
            padding: 6px 8px;
        }

        #fullscreen-rotated-stage .modal-header,
        #fullscreen-rotated-stage .modal-footer {
            padding: 10px 14px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 18px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            overflow: hidden;
            animation: modalPop 0.16s ease-out;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.96); }
            to   { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
        }

        .modal-title {
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .modal-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .modal-body {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .preset-btn {
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            text-align: left;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .preset-btn:hover {
            border-color: var(--indigo-600);
            background: var(--indigo-50);
        }

        .preset-btn strong {
            display: block;
            font-size: 0.78rem;
            color: var(--text-main);
        }

        .preset-btn span {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-input {
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            font-size: 0.84rem;
            color: var(--text-main);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
        }

        .modal-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border-color);
            background: #f8fafc;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .png-preview-box {
            background: #f1f5f9;
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            max-height: 46vh;
            overflow: auto;
        }

        .png-preview-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            background: #ffffff;
        }

        .share-helper-note {
            background: var(--indigo-50);
            border: 1px solid var(--indigo-200);
            color: var(--indigo-700);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.35;
        }

        #toast-container {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 360px;
        }

        #fullscreen-rotated-stage #toast-container {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 90;
        }

        .toast-item {
            background: #0f172a;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================================
           7. PRINT STYLES
           ===================================================================== */
        @media print {
            .app-header, .sub-toolbar, .emp-del-btn, #fullscreen-top-bar {
                display: none !important;
            }
            .main-workspace {
                margin: 0;
                padding: 0;
                max-width: none;
            }
            #fullscreen-rotated-stage {
                box-shadow: none;
                border: none;
            }
            .schedule-table tbody td.sticky-col,
            .schedule-table thead th.sticky-col,
            .schedule-table tfoot td.sticky-col {
                position: static;
                box-shadow: none;
            }
        }
    </style>
